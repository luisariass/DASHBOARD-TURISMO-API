name: CI

on:
  push:
    branches: [main, feat/nest]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar tipos
        run: pnpm run lint

      - name: Ejecutar tests
        run: pnpm test

      - name: Compilar
        run: pnpm run build

      - name: Validar docker-compose
        run: |
          cp .env.example .env
          docker compose config --quiet
