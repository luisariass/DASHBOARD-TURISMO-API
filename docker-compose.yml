services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      # Dentro de la red de Compose, Redis se accede a través del host 'redis'.
      REDIS_URL: redis://redis:6379
      PORT: 8000
      CACHE_ENABLED: "true"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:

# El repo web se conecta a esta misma red para que su Nginx pueda hacer
# proxy_pass a http://api:8000. Créala una sola vez con:
#   docker network create dashboard_net
networks:
  default:
    external: true
    name: dashboard_net
